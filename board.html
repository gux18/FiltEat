<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기피 성분 체크</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #222;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      margin-bottom: 16px;
    }

    h1, h2 {
      margin: 0 0 12px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .plus-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .input-panel {
      margin-top: 12px;
      display: none;
    }

    .input-panel.active {
      display: block;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #d7dce5;
      border-radius: 10px;
      resize: vertical;
      min-height: 90px;
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      background: #2563eb;
      color: white;
    }

    button.secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .muted {
      color: #6b7280;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header-row">
        <div>
          <h1>게시판</h1>
          <p class="muted">피드백을 올려주세요</p>
        </div>
        <button class="plus-btn" onclick="toggleForm()">+</button>
      </div>

      <div id="inputPanel" class="input-panel">
        <textarea id="memoInput" placeholder="내용을 입력하세요"></textarea>
        <div class="row" style="margin-top: 10px;">
          <button onclick="submitMemo()">등록</button>
          <button class="secondary" onclick="toggleForm()">취소</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const panel = document.getElementById('inputPanel');
    const memoInput = document.getElementById('memoInput');

    function toggleForm() {
      panel.classList.toggle('active');
      if (panel.classList.contains('active')) {
        memoInput.focus();
      }
    }

    function submitMemo() {
      const value = memoInput.value.trim();
      if (!value) {
        alert('내용을 입력해주세요.');
        return;
      }

      alert('등록되었습니다: ' + value);
      memoInput.value = '';
      panel.classList.remove('active');
    }
  </script>
</body>
</html>
