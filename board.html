<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게시판</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #222;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      margin-bottom: 16px;
    }

    h1, h2 {
      margin: 0 0 12px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .plus-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .input-panel {
      margin-top: 12px;
      display: none;
    }

    .input-panel.active {
      display: block;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #d7dce5;
      border-radius: 10px;
      resize: vertical;
      min-height: 90px;
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      background: #2563eb;
      color: white;
    }

    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    button.secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .muted {
      color: #6b7280;
      font-size: 13px;
    }

    .memo-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .memo-item {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      white-space: pre-wrap;
      word-break: break-all;
    }

    .memo-date {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header-row">
        <div>
          <h1>게시판</h1>
          <p class="muted">피드백을 올려주세요</p>
        </div>
        <button id="toggleBtn" class="plus-btn" type="button">+</button>
      </div>

      <div id="inputPanel" class="input-panel">
        <textarea id="memoInput" placeholder="내용을 입력하세요"></textarea>
        <div class="row" style="margin-top: 10px;">
          <button id="submitBtn" type="button">등록</button>
          <button id="cancelBtn" class="secondary" type="button">취소</button>
        </div>
      </div>
    </div>

    <div id="memoList" class="memo-list"></div>
  </div>

  <script type="module">
    // 안정성이 검증된 Firebase v10 SDK ESM 사용
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBdicsQX8aQmeF8zRc-xh-1f6Baf3vv9Sc",
      authDomain: "foodavoidance.firebaseapp.com",
      projectId: "foodavoidance",
      storageBucket: "foodavoidance.firebasestorage.app",
      messagingSenderId: "503905836537",
      appId: "1:503905836537:web:3bf376542f1767fd643128",
      measurementId: "G-LXMMWZ1YFP"
    };

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // DOM 파싱 완료 후 초기화
    document.addEventListener('DOMContentLoaded', () => {
      const panel = document.getElementById('inputPanel');
      const memoInput = document.getElementById('memoInput');
      const memoList = document.getElementById('memoList');
      const toggleBtn = document.getElementById('toggleBtn');
      const submitBtn = document.getElementById('submitBtn');
      const cancelBtn = document.getElementById('cancelBtn');

      function toggleForm() {
        panel.classList.toggle('active');
        if (panel.classList.contains('active')) {
          memoInput.focus();
        }
      }

      toggleBtn.addEventListener('click', toggleForm);
      cancelBtn.addEventListener('click', toggleForm);

      // 메모 등록
      submitBtn.addEventListener('click', async () => {
        const value = memoInput.value.trim();
        if (!value) {
          alert('내용을 입력해주세요.');
          return;
        }

        submitBtn.disabled = true;

        try {
          await addDoc(collection(db, "memos"), {
            content: value,
            createdAt: serverTimestamp()
          });

          memoInput.value = '';
          panel.classList.remove('active');
        } catch (error) {
          console.error("Firestore 저장 오류:", error);
          alert("글 저장 권한이 없거나 오류가 발생했습니다. (Console 확인)");
        } finally {
          submitBtn.disabled = false;
        }
      });

      // 실시간 데이터 수신 (안정적인 query 처리)
      const memosRef = collection(db, "memos");
      const q = query(memosRef, orderBy("createdAt", "desc"));

      onSnapshot(q, (snapshot) => {
        memoList.innerHTML = '';

        snapshot.forEach((doc) => {
          const data = doc.data();
          const memoDiv = document.createElement('div');
          memoDiv.className = 'memo-item';
          
          // Timestamp 변환 예외 처리
          let dateStr = '방금 전';
          if (data.createdAt && typeof data.createdAt.toDate === 'function') {
            dateStr = data.createdAt.toDate().toLocaleString('ko-KR');
          }

          memoDiv.innerHTML = `
            <div>${escapeHtml(data.content || '')}</div>
            <div class="memo-date">${dateStr}</div>
          `;
          memoList.appendChild(memoDiv);
        });
      }, (error) => {
        console.error("Firestore 수신 실패:", error);
        // 복합 인덱스 이슈 발생 시 fallback 처리
        if (error.code === 'failed-precondition') {
          console.warn("Firestore Index 설정이 필요할 수 있습니다.");
        }
      });

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
      }
    });
  </script>
</body>
</html>
