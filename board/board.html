<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게시판</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header-row">
        <div>
          <h1>게시판</h1>
          <p class="muted">피드백을 올려주세요</p>
        </div>
        <button id="toggleBtn" class="plus-btn" type="button">+</button>
      </div>

      <div id="inputPanel" class="input-panel">
        <textarea id="memoInput" placeholder="내용을 입력하세요"></textarea>
        <div class="row" style="margin-top: 10px;">
          <button id="submitBtn" type="button">등록</button>
          <button id="cancelBtn" class="secondary" type="button">취소</button>
        </div>
      </div>
    </div>

    <div id="memoList" class="memo-list"></div>
  </div>

  <script type="module" src="board.js"></script>
</body>
</html>
