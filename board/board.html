<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>식품 정보 게시판</title>

  <link rel="stylesheet" href="../style.css">
</head>

<body class="board-page">
  <main class="board-shell">
    <a href="../index.html" class="home-button">
      <span aria-hidden="true">←</span>
      홈페이지로
    </a>
    <!-- 게시판 상단 소개 -->
    <header class="board-hero">
      <div>
        <span class="board-eyebrow">COMMUNITY</span>

        <h1>식품 정보 게시판</h1>

        <p>
          건강 정보에 관한 의견과 FiltEat 사용
          경험을 자유롭게 공유해 보세요.
        </p>
      </div>

      <div class="board-live-badge">
        <span class="board-live-dot"></span>
        실시간 업데이트
      </div>
    </header>

    <!-- 게시글 작성 영역 -->
    <section class="board-compose-card">
      <div class="board-compose-header">
        <div>
          <h2>새 게시글 작성</h2>

          <p>
            다른 사용자에게 도움이 될 수 있는 내용을 남겨주세요.
          </p>
        </div>

        <button
          id="toggleBtn"
          class="plus-btn"
          type="button"
          aria-label="게시글 작성창 열기"
          aria-expanded="false"
        >
          +
        </button>
      </div>

      <div id="inputPanel" class="input-panel">
        <label
          for="memoInput"
          class="board-input-label"
        >
          게시글 내용
        </label>

        <textarea
          id="memoInput"
          maxlength="500"
          placeholder="공유하고 싶은 내용을 입력하세요."
        ></textarea>

        <div class="board-form-footer">
          <span class="board-helper">
            개인정보나 민감한 내용은 작성하지 마세요.
          </span>

          <div class="board-actions">
            <button
              id="cancelBtn"
              class="secondary"
              type="button"
            >
              취소
            </button>

            <button
              id="submitBtn"
              type="button"
            >
              게시글 등록
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 게시글 목록 -->
    <section class="board-feed">
      <div class="board-feed-header">
        <div>
          <span class="board-eyebrow">RECENT POSTS</span>
          <h2>최근 게시글</h2>
        </div>

        <p>새 글이 등록되면 자동으로 반영됩니다.</p>
      </div>
      <div class="board-search-area">
        <div class="board-search-box">
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
      
          <input
            type="search"
            id="boardSearchInput"
            maxlength="50"
            placeholder="게시글 내용 검색"
            autocomplete="off"
          >
        </div>
      </div>
      
      <p
        id="searchResultText"
        class="board-search-result"
        aria-live="polite"
      ></p>
      
      <p
        id="searchResultText"
        class="board-search-result"
        aria-live="polite"
      ></p>

      <div id="memoList" class="memo-list">
        <div class="board-status-message">
          게시글을 불러오는 중입니다.
        </div>
      </div>
    </section>

    <!-- 안내 -->
    <aside class="board-notice">
      <strong>게시판 이용 안내</strong>

      <p>
        게시된 식품 및 건강 정보는 개인의 경험이나 의견일 수 있습니다.
        중요한 건강 결정은 전문가의 안내와 제품 공식 정보를 함께 확인하세요.
      </p>
    </aside>

  </main>

  <script type="module" src="board.js"></script>
</body>
</html>
